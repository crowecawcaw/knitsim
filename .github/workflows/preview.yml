name: PR preview

# Builds each PR and publishes it to gh-pages/pr-preview/pr-<number>/.
# The action posts (and keeps updating) a comment on the PR with the link,
# and removes the preview when the PR is closed.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run typecheck
      - if: github.event.action != 'closed'
        run: npm test
      - if: github.event.action != 'closed'
        run: npm run build
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
